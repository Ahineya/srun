name: Build

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (native on GitHub macOS ARM runners)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: srun-darwin-arm64
            setup_cross: false

          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: srun-linux-amd64
            setup_cross: false

          # Linux ARM64 (cross-compile from Ubuntu x86_64)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: srun-linux-arm64
            setup_cross: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install AArch64 Linux linker
        if: matrix.setup_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure Cargo linker (Linux ARM64)
        if: matrix.setup_cross
        run: |
          mkdir -p .cargo
          printf '%s\n' \
            '[target.aarch64-unknown-linux-gnu]' \
            'linker = "aarch64-linux-gnu-gcc"' \
            > .cargo/config.toml

      - name: cargo build --release
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/srun

  # Workflow artifacts (above) appear on each run. This job attaches the same
  # binaries to a GitHub Release when you push a tag like v0.3.0.
  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: srun-*
          path: dist
          merge-multiple: true

      - name: Stage release files
        run: |
          mkdir -p upload
          cp dist/srun-darwin-arm64/srun upload/srun-darwin-arm64
          cp dist/srun-linux-amd64/srun upload/srun-linux-amd64
          cp dist/srun-linux-arm64/srun upload/srun-linux-arm64
          chmod +x upload/*

      - name: Create release with binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
